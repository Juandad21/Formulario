<html> 
<head>
    <title>Formulario de Registro</title>
</head>
<body>
    <header style="background-color: #f2f2f2; padding: 20px; text-align: center;">
        <h1>Registro de Usuario</h1>
    </header>

    <main style="padding: 20px; background-color: #e6e6e6; text-align: justify;">
        <form action="/submit" method="post" >

            <label for="Tipo de documento">Tipo de documento:</label>
            <select id="Tipo de documento" name="Tipo de documento" required>
                <option value="">Seleccione un tipo de documento</option>
                <option value="CC">Cédula de Ciudadanía</option>
                <option value="CE">Cédula de Extranjería</option>
                <option value="TI">Tarjeta de Identidad</option>
                <option value="PP">Pasaporte</option>
            </select><br><center></center><br>

            <label for="number">Número de documento:</label>
            <input type="text" id="number" name="number" required required maxlength="10"><br><br>

            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required minlength="3" maxlength="64"><br><br>

            <label for="lastname">Apellido:</label>
            <input type="text" id="lastname" name="lastname" required minlength="3" maxlength="64"><br><br>

            <label for="phone">Número de teléfono:</label>
            <input type="tel" id="phone" name="phone" required maxlength="15"><br><br>

            <label for="address">Dirección:</label>
            <input type="text" id="address" name="address" required maxlength="100"><br><br>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}" required><br><br>

            <label for="hobbies">Pasatiempos:</label>
            <input type="checkbox" id="hobbies1" name="hobbies" value="Deportes">
            <label for="hobbies1">Deportes</label><br>
            <input type="checkbox" id="hobbies2" name="hobbies" value="Música">
            <label for="hobbies2">Música</label><br>
            <input type="checkbox" id="hobbies3" name="hobbies" value="Lectura">
            <label for="hobbies3">Lectura</label><br>
            <input type="checkbox" id="hobbies4" name="hobbies" value="Viajar">
            <label for="hobbies4">Viajar</label><br><br>

            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario" required pattern="[A-Za-z]{3,14}[0-9]{0,2}" 
            title="Debe tener entre 3 y 16 caracteres, solo letras y hasta 2 números al final" required><br><br>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required  pattern="(?=(.*[A-Z]){1})(?=(.*[a-z]){2})(?=(.*[0-9]){5})(?=.*[!\?\-\+\/&\$]).{16}"
            title="Debe tener 16 caracteres, 1 mayúscula, 2 minúsculas, 5 números y 1 símbolo (!?-+/&$)"required><br><br>

            <label for="Registration date">Fecha de registro:</label>
            <input type="date" id="Registration date" name="Registration date" min="2026-02-15" max="2026-03-06" required><br><br>

            <input type="submit" value="enviar">
            <input type="reset" value="limpiar">

        </form>

            <audio controls>
            <source src="Audios/audio1.mp3" type="audio/mpeg">
             Your browser does not support the audio element.
            </audio>

            <br><br>

            <video width="320" height="240" controls>
            <source src="Videos/video1.mp4" type="video/mp4">
             Your browser does not support the video tag.
            </video>
    </main>
</body>
</html>
